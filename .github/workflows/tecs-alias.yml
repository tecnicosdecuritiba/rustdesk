name: TECS Alias

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TECS Build"]
    types: [completed]

permissions:
  contents: write

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - name: Publish tecs_remoto.exe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          src=$(gh release view tecs --json assets -q '.assets[].name' | grep -E '^rustdesk-.*-x86_64\.exe$' | sort -V | tail -1)
          test -n "$src"
          gh release download tecs -p "$src" -O tecs_remoto.exe --clobber
          gh release upload tecs tecs_remoto.exe --clobber
